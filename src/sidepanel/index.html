<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SideTab Lite</title>
    <link rel="stylesheet" href="./sidebar.css" />
  </head>
  <body>
    <main class="sidebar-shell">
      <div
        id="shortcut-strip"
        class="shortcut-region shortcut-strip"
        aria-label="快捷网站"
        hidden
      ></div>

      <section id="tab-region" class="tab-region" aria-label="当前窗口标签页">
        <p id="tab-empty" class="empty-message" hidden>没有匹配的标签页</p>
        <div id="tab-scroll" class="tab-scroll">
          <div id="tab-list" class="tab-list" role="list"></div>
          <button
            id="new-tab-button"
            class="new-tab-button"
            type="button"
            title="新建标签页"
            aria-label="新建标签页"
          >
            +
          </button>
        </div>
      </section>

      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

      <footer class="bottom-toolbar">
        <div
          id="history-search-results"
          role="listbox"
          aria-label="历史记录搜索结果"
          hidden
        ></div>
        <div class="search-shell">
          <input
            id="tab-search"
            type="search"
            placeholder="搜索历史记录"
            aria-label="搜索历史记录"
            autocomplete="off"
          />
          <button
            id="shortcut-settings"
            class="icon-button"
            type="button"
            title="设置"
            aria-label="设置"
          ></button>
        </div>
      </footer>
    </main>

    <dialog id="shortcut-dialog" aria-labelledby="shortcut-dialog-title">
      <form id="shortcut-form" method="dialog" novalidate>
        <header class="dialog-header">
          <h2 id="shortcut-dialog-title">设置</h2>
        </header>

        <section class="settings-section" aria-labelledby="appearance-heading">
          <h3 id="appearance-heading">外观</h3>
          <label class="number-setting" for="tab-title-font-size">
            <span>标签标题字号</span>
            <input
              id="tab-title-font-size"
              type="number"
              min="12"
              max="18"
              step="1"
              inputmode="numeric"
            />
          </label>
          <div class="appearance-setting">
            <span>侧边栏位置</span>
            <span class="appearance-setting-hint">请在 Chrome 外观设置中修改</span>
            <button
              id="chrome-appearance-settings"
              class="appearance-settings-link"
              type="button"
              title="打开 Chrome 外观设置"
              aria-label="打开 Chrome 外观设置"
            >
              ↗
            </button>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="shortcuts-heading">
          <h3 id="shortcuts-heading">快捷网站</h3>
          <label class="toggle-label" for="shortcut-enabled">
            <input id="shortcut-enabled" type="checkbox" />
            <span>启用快捷入口</span>
          </label>

          <div id="shortcut-editor-list" class="editor-list"></div>
        </section>
        <p id="shortcut-error" class="shortcut-error" role="alert"></p>

        <div class="dialog-actions dialog-actions-secondary">
          <button id="shortcut-add" type="button">添加网站</button>
          <button id="shortcut-reset" type="button">恢复默认</button>
        </div>
        <div class="dialog-actions dialog-actions-primary">
          <button id="shortcut-cancel" type="button" data-action="cancel">取消</button>
          <button id="shortcut-save" class="primary-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./sidebar.js"></script>
  </body>
</html>
